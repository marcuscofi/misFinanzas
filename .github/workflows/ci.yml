name: CI

on:
  push:
    branches: [qa, main]
  pull_request:
    branches: [qa, main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mis_finanzas
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyze (Ignoring Warnings & Infos)
        run: |
          # Añadimos '|| true' para evitar que el exit code 1 de flutter analyze rompa el script de inmediato
          output=$(flutter analyze --no-pub || true)
          echo "$output"
          
          if echo "$output" | grep -q "error •"; then
            echo "❌ Se encontraron errores fatales en el análisis."
            exit 1
          else
            echo "✅ No hay errores fatales. Warnings e infos omitidos para continuar el CI."
            exit 0
          fi

      - name: Run tests
        run: flutter test

      - name: Build Web Release
        run: >
          flutter build web --release
          --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY
          --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID
          --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID
          --dart-define=FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN
          --dart-define=FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET