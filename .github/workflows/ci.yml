name: CI

on:
  push:
    branches: [qa, main]
  pull_request:
    branches: [qa, main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mis_finanzas
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release